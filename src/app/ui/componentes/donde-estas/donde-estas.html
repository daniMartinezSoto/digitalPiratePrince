@if (info(); as i) {
  <fieldset>
    <legend>Dónde estás</legend>
    <p>
      Estás en <strong>{{ i.aqui }}</strong>, {{ i.aBordo ? 'a bordo' : 'a pie' }}.
      @if (!i.aBordo) { El barco está en {{ i.barco }}. }
    </p>
    @if (i.enAccion) {
      @if (i.embarcar) {
        <button type="button" (click)="embarcar()">Embarcar</button>
      }
      @for (d of i.desembarcar; track d.texto) {
        <button type="button" (click)="desembarcar(d.casilla)">{{ d.texto }}</button>
      }
      @if (i.motivo) { <small>Barco: {{ i.motivo }}</small> }
    }
  </fieldset>
}
